! nfacctd - NetFlow collector for Switchboard (the LXC at 192.168.0.155)
!
! A second daemon beside sfacctd on the same host. The switches speak
! sFlow and OPNsense speaks NetFlow v9, and pmacct ships one binary per
! protocol - same codebase, same pgsql plugin, same aggregation, so
! almost everything here mirrors sfacctd.conf. Read that file first: the
! reasoning behind the shared settings is written there and not repeated.
!
! The differences are all below, and each one is a difference in the
! protocol rather than a preference.

! Not daemonized, and no pidfile. systemd runs this in the foreground and
! supervises the process directly (Type=simple).
!
! Type=forking + PIDFile= is racy in two ways, both seen here: systemd can
! read the pid file before pmacct has written it ("Can't open PID file
! (yet?) after start"), and a *stale* one makes it adopt a process it does
! not own - "Supervising process N which is not our child", after which
! the unit reports success while nothing is collecting at all. Letting
! systemd own the process removes the file, the race and the ambiguity,
! and sends pmacct's logging to the journal where journalctl -u finds it.
daemonize: false

! 2055 is the de facto NetFlow port and what OPNsense's exporter targets.
! IPFIX would be 4739; nfacctd decodes v5, v9 and IPFIX on whichever port
! it is told to listen on, so this is about matching the sender, not about
! which versions are understood.
nfacctd_ip: 0.0.0.0
nfacctd_port: 2055

plugins: pgsql

! Identical to sfacctd's, deliberately: the two tables have the same
! columns so a view written against one works against the other.
aggregate: peer_src_ip, in_iface, out_iface, src_host, dst_host, src_port, dst_port, proto

sql_host: 192.168.0.146
sql_user: claude
sql_passwd: claude
sql_db: switchboard

! A separate table, not sflow_flows. The two measure the same traffic
! from different places - a LAN host reaching the internet crosses both
! the S4048 and the firewall - so anything summing them double-counts.
! They also differ in kind: sFlow here is 1:1024 sampled and renormalized
! into an estimate, while this is every flow the firewall actually saw.
sql_table: netflow_flows

sql_history: 1m
sql_history_roundoff: m
sql_refresh_time: 60
sql_dont_try_update: true
sql_optimize_clauses: true
sql_startup_delay: 5

! Stamp flows when they arrive here, not with the timestamps the exporter
! put in them. NetFlow records carry the *sender's* clock, so any skew on
! the firewall lands its flows in the wrong minute buckets - which shows
! up as a gap or a spike in the chart and reads as a traffic event rather
! than a clock problem. sFlow has no equivalent hazard because sfacctd
! already stamps on arrival.
nfacctd_time_new: true

! Renormalize only if the exporter says it sampled. OPNsense's exporter
! is unsampled by default, in which case there is no sampling info in the
! v9 option templates and this does nothing - the counters are already
! exact. Left on so that turning sampling on at the firewall later does
! not silently start under-reporting by the sampling factor.
nfacctd_renormalize: true

! A note for whoever next sees "nfacctd is running, packets are arriving,
! the table is empty" and concludes it is broken.
!
! NetFlow v9 splits the data from its description. Records carry a
! template ID; the template that says what those fields *are* is sent
! separately, on the exporter's own schedule. Until one arrives every data
! record is discarded - visibly, with `debug: true`:
!
!   Discarded NetFlow v9/IPFIX packet (R: unknown template 256)
!
! OPNsense here re-sends templates roughly every 75 seconds, so after any
! restart of this daemon expect up to ~75s of discards, then a further
! flush interval before rows appear - around two minutes of looking
! broken while being entirely healthy. sFlow has no equivalent: an sFlow
! datagram is self-describing, which is why sfacctd starts producing rows
! within one flush.
!
! It also means restarting the *exporter* is the fix if templates somehow
! never arrive, and that is a change on the firewall, not here.

plugin_pipe_size: 10240000
plugin_buffer_size: 10240
