! sfacctd - sFlow collector for Switchboard (the LXC at 192.168.0.155)
!
! Receives sFlow from the switches and writes flow records straight into
! the same Postgres the webui reads (table: sflow_flows). No intermediate
! store: pmacct's postgresql plugin is the shipper, so there is one less
! moving part than the syslog path's Vector -> Loki -> webui.
!
! The `aggregate` line below and the sflow_flows column names are a single
! contract: pmacct maps each primitive to a fixed column name
! (peer_src_ip -> peer_ip_src, src_port -> port_src, ...) and refuses to
! start if the table doesn't match. Change one, change both - see
! common/db.py where the table is defined.

daemonize: true
pidfile: /var/run/sfacctd.pid

! 6343 is the sFlow default and what Dell OS9 uses unless told otherwise.
sfacctd_ip: 0.0.0.0
sfacctd_port: 6343

plugins: pgsql

! What a flow record is keyed by. peer_src_ip is the sending switch;
! in/out iface are the sFlow ifIndex values, which the webui maps back to
! real port names. Together these serve all four views: top talkers
! (src/dst host), protocol mix (ports + proto), and per-port breakdown
! (iface_in/out).
aggregate: peer_src_ip, in_iface, out_iface, src_host, dst_host, src_port, dst_port, proto

sql_host: 192.168.0.146
sql_user: claude
sql_passwd: claude
sql_db: switchboard
sql_table: sflow_flows

! Deliberately NO sql_table_schema. pmacct executes that file as DDL at
! startup, and the table is already created and owned by the webui
! (common/db.py's SCHEMA, like every other table here). Pointing pmacct at
! it produced `ERROR: relation "sflow_flows" already exists` on every
! purge - harmless but noise that would mask a real error later. One
! creator, one place: sflow/sflow_flows.schema is kept as documentation
! only.

! Bucket flows into 1-minute windows and flush every 60s. Without
! sql_history every record would carry its own arrival time and the table
! would be one row per flow rather than per flow-per-minute, which is what
! makes "top talkers over the last hour" a cheap aggregate instead of a
! scan over raw samples.
sql_history: 1m
sql_history_roundoff: m
sql_refresh_time: 60

! INSERT-only. The default tries UPDATE-then-INSERT, which needs a unique
! index over every aggregation key - a wide, expensive index for data that
! is append-only by nature.
sql_dont_try_update: true

! Required, and not optional here: `peer_src_ip` is classed as a BGP
! primitive, which makes pmacct infer a fixed "bgp" table layout and then
! refuse with "IP host accounting not supported for selected
! sql_table_version/_type". sql_optimize_clauses tells it to build its
! INSERTs from the `aggregate` line above against our own table instead of
! matching a numbered built-in schema. Found by running the daemon rather
! than reading docs - it starts, connects, and only then rejects.
sql_optimize_clauses: true

! Multiply counters by each sample's own sampling rate, so `bytes` is an
! estimate of real traffic rather than the raw bytes that happened to be
! sampled. Not pmacct's default, and its absence is invisible until
! something changes: counts understate reality by the sampling factor, two
! switches at different rates are not comparable, and changing a rate puts
! a step in the traffic chart that looks like a traffic event and isn't.
!
! Verified against a known load - a ~40 Gbit/s bidirectional iperf run:
! renormalized sFlow reported ~310 GB/min against ~300 GB/min actual, and
! ~10.8 Gbit/s on a 10G port running ~9.9, both within sFlow's sampling
! variance.
!
! A previous check appeared to show this 15x too high on the Dell and it
! was briefly disabled. That check was wrong, not the setting: it compared
! a 10-minute sFlow window against a 30-minute average of the SSH-polled
! counters, and that average was mostly idle time (2248 Mbit/s mean
! against a 9900 Mbit/s peak). Compare like windows against like, and
! prefer a known generated load over a polled average - `metric_samples`
! is written on the slow poll cadence and is too sparse to match minute
! for minute.
sfacctd_renormalize: true

! Keep going if Postgres is briefly unavailable rather than dropping the
! daemon; sFlow is UDP and unrecoverable once missed, so staying up
! through a blip matters more than perfect delivery.
sql_startup_delay: 5
plugin_pipe_size: 10240000
plugin_buffer_size: 10240
