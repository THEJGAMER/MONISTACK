services:
  s4048-exporter:
    # Build context is the repo root, not ./exporter, because the image
    # needs files from common/ (shared with webui - see exporter/Dockerfile)
    # as well as exporter/ itself; Docker COPY can't reach outside its
    # build context.
    build:
      context: .
      dockerfile: exporter/Dockerfile
    container_name: s4048-exporter
    restart: unless-stopped
    env_file: .env
    environment:
      # 10s, down from the 30s default (2026-08-02) - confirmed live via
      # s4048_scrape_duration_seconds{section="fast"} that one poll cycle
      # (CPU/memory/fan/PSU/interfaces - NOT the separate slow transceiver
      # scrape) only takes ~0.46s, so there's ample headroom. Real PSU-pull
      # test showed ~90s from the physical event to Switchboard even
      # showing "pending" - this was the largest single piece of that
      # (stacked with Prometheus's scrape_interval and evaluation_interval,
      # both tightened alongside this - see prometheus/prometheus.yml).
      FAST_POLL_INTERVAL: "10"
    ports:
      - "9101:9101"

  webui:
    # Build context is the repo root, not ./webui - same reason as
    # s4048-exporter above (needs common/, shared with the exporter).
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: s4048-webui
    restart: unless-stopped
    env_file: .env
    volumes:
      - webui-data:/app/data
      # Writable mount of the exact file Prometheus reads its alert rules
      # from (below) - the Rules tab on the Alerts page (ROADMAP 3.2)
      # regenerates this file from Postgres and calls Prometheus's
      # /-/reload API, rather than requiring a container recreate the way
      # a manual YAML edit did (see the 2026-08-01 bind-mount note).
      - ./prometheus/alerts.yml:/app/data/prometheus-alerts.yml
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    # --web.enable-lifecycle turns on POST /-/reload, so webui's Rules
    # tab can push a rule change live instead of needing this container
    # recreated - otherwise identical to the image's default command.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - s4048-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  webui-data:
