# Vector Configuration for Network Syslog Ingestion

sources:
  syslog_udp:
    type: syslog
    mode: udp
    address: 0.0.0.0:514

  syslog_tcp:
    type: syslog
    mode: tcp
    address: 0.0.0.0:514

transforms:
  process_syslog:
    type: remap
    inputs:
      - syslog_udp
      - syslog_tcp
    source: |
      .service = "syslog"

      # Standardize host string cleanly
      if exists(.host) && .host != null {
        .device_host = to_string!(.host)
      } else if exists(.source_ip) && .source_ip != null {
        .device_host = to_string!(.source_ip)
      } else {
        .device_host = "unknown"
      }

      # The S4048 is configured with its clock in local time ("show clock
      # detail" reports "sydney", NTP-synced) and sends legacy BSD-syslog
      # timestamps with no UTC offset on the wire (verified by sniffing
      # the raw packet: "<189>Jul 30 17:48:00 S4048 ..." - no year, no
      # offset). Vector's `syslog` source has no config to tell it the
      # sender's zone (checked `vector generate-schema`: the source's
      # only options are host_key/log_namespace/max_length), so it
      # assumes naive timestamps are already UTC - every device_timestamp
      # came out 10 hours fast (a message logged at real UTC 07:42:17
      # arrived with device_timestamp 17:42:17Z: the switch's local wall
      # clock digits, mislabeled UTC). Fixed by taking the wall-clock
      # digits Vector parsed, discarding its incorrect UTC label, and
      # reinterpreting them as Australia/Sydney - using the real zone
      # database (not a hardcoded +10) so this keeps working across
      # Sydney's DST transitions.
      naive_str = format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%S")
      corrected, tz_err = parse_timestamp(naive_str, "%Y-%m-%dT%H:%M:%S", timezone: "Australia/Sydney")
      if tz_err == null {
        .device_timestamp = corrected
      } else {
        .device_timestamp = .timestamp
      }

      # Keep the device-reported (now timezone-corrected) time for
      # humans, but ship on ingestion time so out-of-order UDP/TCP
      # delivery can't produce out-of-order timestamps within a Loki
      # stream (Loki rejects those).
      .timestamp = now()

  # --- Switch syslog interpreter --------------------------------------
  # Turns each vendor's own free-text message shape into the same set of
  # structured fields, so consumers (webui's syslog view, hardware_alerting.py)
  # don't need to know which vendor sent a given line:
  #   - Dell OS9: "%FACILITY-SEVERITY-MNEMONIC: detail" (verified live,
  #     see below).
  #   - Junos (EX3300): "process[pid]: TAG: detail", e.g. confirmed live
  #     from the real EX3300 (192.168.4.1 - see webui's syslog view):
  #     "mgd[44954]: UI_CMDLINE_READ_LINE: User 'root', command 'exit '".
  #     Junos has no per-message severity digit or "%" prefix at all, so
  #     this needs its own regex, not a tweak of Dell's.
  # Both shapes produce the same facility/mnemonic/detail/event_category/
  # link_state/alarm_* fields below - a message either matches Dell's
  # shape, or Junos's, or neither (falls back to raw .message in .detail,
  # event_category "other").
  interpret_switch_event:
    type: remap
    inputs:
      - process_syslog
    source: |
      dell, dell_err = parse_regex(.message, r'%(?P<facility>[A-Z0-9]+)-(?P<severity_num>\d)-(?P<mnemonic>[A-Z0-9_-]+):\s*(?P<detail>.*)$')
      junos, junos_err = parse_regex(.message, r'^(?P<process>[a-zA-Z0-9_-]+)\[\d+\]:\s*(?P<tag>[A-Z][A-Z0-9_]*):\s*(?P<detail>.*)$')
      if dell_err == null {
        .vendor = "dell_os9"
        .facility = dell.facility
        .severity_num = to_int(dell.severity_num) ?? null
        .mnemonic = dell.mnemonic
        .detail = dell.detail
      } else if junos_err == null {
        # Junos has no "%FACILITY" concept - the closest real equivalent
        # is which daemon logged the line (mib2d for SNMP/interface
        # traps, chassisd/alarmd for hardware, sshd for auth, mgd for
        # CLI/config sessions - all real Junos process names), so that's
        # used as .facility the same way Dell's own facility code is,
        # letting one category_map below serve both vendors.
        .vendor = "junos"
        .facility = upcase(to_string(junos.process))
        .mnemonic = junos.tag
        .detail = junos.detail
      } else {
        .vendor = null
        .detail = .message
      }

      category_map = {
        "SEC": "auth", "SSH": "auth", "AAA": "auth",
        "IFM": "interface", "LINK": "interface", "IFAGT": "interface",
        "IFMGR": "interface", "LACP": "interface",
        "STP": "spanning-tree", "RPM": "hardware", "ENVMON": "hardware",
        "OSTATE": "hardware", "CHMGR": "hardware",
        "FIB": "routing", "OSPF": "routing", "BGP": "routing",
        # Junos process-name facilities (see above) - MGD (CLI/config
        # sessions, confirmed live as the bulk of real EX3300 traffic so
        # far) deliberately has no entry, falling back to "other" same as
        # an unrecognized Dell facility would.
        "MIB2D": "interface", "CHASSISD": "hardware", "ALARMD": "hardware",
        "SSHD": "auth", "RPD": "routing", "KMD": "auth"
      }
      .event_category = "other"
      if exists(.facility) {
        mapped = get(category_map, [.facility]) ?? null
        if mapped != null {
          .event_category = mapped
        }
      }

      detail_str = to_string(.detail) ?? ""

      iface, iferr = parse_regex(detail_str, r'(?i)(?P<if_type>TenGigabitEthernet|GigabitEthernet|fortyGigE|Port-channel|Vlan|Te|Gi|Fo)\s?(?P<if_num>\d+(/\d+)*)')
      if iferr == null {
        if_type_str = to_string(iface.if_type)
        if_num_str = to_string(iface.if_num)
        .interface = if_type_str + " " + if_num_str
      } else {
        # Junos's own SNMP link traps report the interface as "ifName
        # xe-0/0/0" rather than Dell's "Te 1/47" wording - not verified
        # against a real EX3300 link flap yet (none has occurred since
        # syslog was pointed here), written from Juniper's documented
        # SNMP_TRAP_LINK_DOWN/UP message shape rather than a live capture,
        # same caveat as the mnemonic check below.
        jiface, jiferr = parse_regex(detail_str, r'(?i)ifname\s+(?P<name>[a-z0-9./-]+)')
        if jiferr == null {
          .interface = to_string(jiface.name)
        }
      }

      detail_lower = downcase(detail_str)

      # Confirmed live: the real message is "Changed interface state to
      # down: Te 1/47" - "changed state to down" (missing "interface")
      # never matched it, so .link_state/.link_event were always null/
      # false for genuine link transitions. Worse, the old "is down"/
      # "is up" substrings matched unrelated hardware messages instead
      # (e.g. "Power supply 2 in unit 1 is up"), so this used to report
      # PSU/fan events as "link events" while missing every real one.
      # Scoping to event_category == "interface" (computed above) fixes
      # both: only interface-facility messages can set link_state now.
      #
      # The Junos SNMP_TRAP_LINK_DOWN/UP mnemonic check is written from
      # Juniper's own documented standard message IDs (mib2d emits these
      # on every real link transition), not a live capture - flagged the
      # same as the interface-name extraction above: should be confirmed
      # against a real EX3300 link flap once one occurs, same discipline
      # as this file's other not-yet-observed cases.
      .link_state = null
      if .event_category == "interface" {
        if contains(detail_lower, "changed interface state to down") || contains(detail_lower, "link down") || .mnemonic == "SNMP_TRAP_LINK_DOWN" {
          .link_state = "down"
        } else if contains(detail_lower, "changed interface state to up") || contains(detail_lower, "link up") || .mnemonic == "SNMP_TRAP_LINK_UP" {
          .link_state = "up"
        }
      }
      .link_event = .link_state != null

      # --- Hardware alarm normalization -----------------------------
      # Dell's own severity for these (both the syslog PRI-derived
      # `.severity` and the digit embedded in "%FACILITY-N-MNEMONIC")
      # is unreliable for CHMGR (chassis manager - fan/PSU) messages:
      # verified live that "%CHMGR-0-PS_UP: Power supply 2 in unit 1 is
      # up" - a plain recovery notice - comes in at digit 0 (nominally
      # "emergency"), the same tier as an actual "%CHMGR-0-PS_DOWN:
      # Major alarm: Power supply 2 in unit 1 is down". The only
      # reliable signal is the free text itself, so alarm severity is
      # derived from that instead, checked against the real captured
      # samples that exposed this before shipping:
      #   "Major alarm: ..."          -> critical, active
      #   "Minor Alarm : ..."         -> minor, active
      #   "... is down"/"is removed" (no explicit alarm text) -> minor, active
      #   "... is up"/"is inserted"   -> not an alarm (recovery)
      #   anything else (e.g. fan-speed-% telemetry, no fault language) -> not an alarm
      #
      # Scoped to event_category == "hardware" (unlike Dell's own
      # historical version of this block, which checked every message's
      # text regardless of category) specifically so Junos's much more
      # generic down/up/removed/inserted wording - plausible in routing
      # or auth log lines too - can reuse the same keyword checks below
      # without misreading an unrelated message as a hardware alarm; this
      # also matches the reasoning already applied to link_state above.
      # Junos's own chassisd/alarmd wording for a real FRU fault hasn't
      # been captured live yet (same caveat as link_state/interface
      # above) - "offline"/"removed"/"power off" and "online"/"inserted"/
      # "power on" are Juniper's commonly-documented phrasing for FRU
      # transitions, generalized rather than pinned to one exact string,
      # so a close-but-not-identical real message still matches.
      .alarm_severity = null
      .alarm_active = null
      .alarm_component = null
      if .event_category == "hardware" {
        # "cleared" must be checked before the "major/minor alarm" text
        # match below - Dell's own recovery messages ("Major alarm
        # cleared: ...") contain the literal substring "major alarm", so
        # without this ordering a recovery gets misread as a brand-new
        # active critical alarm (verified against real captured
        # "... alarm cleared ..." / "... alarm cleared : ..." text).
        if contains(detail_lower, "cleared") {
          .alarm_active = false
        } else if contains(detail_lower, "major alarm") {
          .alarm_severity = "critical"
          .alarm_active = true
        } else if contains(detail_lower, "minor alarm") {
          .alarm_severity = "minor"
          .alarm_active = true
        } else if contains(detail_lower, "is down") || contains(detail_lower, "is removed") || contains(detail_lower, "offline") || contains(detail_lower, "removed") || contains(detail_lower, "power off") {
          .alarm_severity = "minor"
          .alarm_active = true
        } else if contains(detail_lower, "is up") || contains(detail_lower, "is inserted") || contains(detail_lower, "online") || contains(detail_lower, "inserted") || contains(detail_lower, "power on") {
          .alarm_active = false
        }
        if .alarm_severity != null || .alarm_active == false {
          component = detail_str
          component = replace(component, r'(?i)^(major|minor)\s+alarm\s+cleared\s*:?\s*', "")
          component = replace(component, r'(?i)^(major alarm:\s*|minor alarm\s*:\s*)', "")
          component = replace(component, r'(?i)^snmp\s+trap\s+generated\s*:\s*', "")
          component = replace(component, r'(?i)\s+is\s+(up|down|inserted|removed)\s*$', "")
          component = replace(component, r'(?i)\s+(alarm\s+)?reported(\s+in\s+unit\s+\d+)?\s+is\s+cleared\s*$', "")
          component = replace(component, r'(?i)\s+(went\s+)?(offline|online)\s*$', "")
          .alarm_component = strip_whitespace(component)
        }
      }

sinks:
  loki_sink:
    type: loki
    inputs:
      - interpret_switch_event
    endpoint: http://192.168.0.145:3100
    healthcheck:
      enabled: false
    dangerously_allow_unconfined_template_resolution: true
    encoding:
      codec: json
    labels:
      job: syslog
      host: "{{ device_host }}"

  console_out:
    type: console
    inputs:
      - interpret_switch_event
    encoding:
      codec: json
