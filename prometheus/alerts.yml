# GENERATED by Switchboard's Alerts > Rules tab - do not hand-edit.
# Source of truth is the alert_rules Postgres table; this file is
# regenerated and Prometheus is live-reloaded on every save there.
groups:
- name: s4048-hardware
  rules:
  - alert: S4048DeviceDown
    expr: s4048_up == 0
    labels:
      severity: critical
    annotations:
      summary: S4048 poll failing
      description: The exporter's last SSH poll of the S4048 failed - device may be
        unreachable, or credentials/SSH config drifted.
    for: 300s
  - alert: S4048FanDown
    expr: s4048_fan_status == 0
    labels:
      severity: warning
    annotations:
      summary: Fan {{ $labels.fan }} down (unit {{ $labels.unit }}, bay {{ $labels.bay
        }})
      description: show environment reports this fan as down.
    for: 120s
  - alert: S4048InterfaceFlapping
    expr: changes(s4048_interface_up[15m]) > 4
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.port }} ({{ $labels.description }}) is flapping'
      description: This interface's link state changed more than 4 times in the last
        15 minutes.
  - alert: S4048PSUDown
    expr: s4048_psu_status == 0
    labels:
      severity: critical
    annotations:
      summary: PSU {{ $labels.unit }}/{{ $labels.bay }} down
      description: show environment reports this power supply as down - if the other
        PSU is also degraded this is a single point of failure.
    for: 120s
  - alert: S4048TransceiverAlarm
    expr: s4048_transceiver_alarm == 1 and on(port) s4048_interface_up == 1
    labels:
      severity: warning
    annotations:
      summary: Transceiver alarm on {{ $labels.port }} ({{ $labels.flag }})
      description: The optic's own DOM alarm bit is set (show interfaces transceiver)
        on a link that's currently up - Rx/Tx power, temperature, voltage, or bias
        current is outside the vendor's programmed threshold for this specific optic.
    for: 300s
